name: calculator

services:
  calculator:
    image: ${IMAGE_NAME:-ar3snd/spe-mini_project-calculator:latest}
    pull_policy: always
    environment:
      SERVER_PORT: "8080"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    expose:
      - "8080"
    networks:
      - calculator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calculator-network
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  calculator-network:
    driver: bridge